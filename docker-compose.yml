services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gitcontext-postgres
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - gitcontext_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/ini-extensions:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gitcontext_pg_data:
    name: gitcontext_pg_data 